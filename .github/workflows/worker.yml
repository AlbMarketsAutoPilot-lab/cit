name: Worker

# Deploys the Cloudflare Worker after each merge to main: tables (safe to repeat), code, then secrets.
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit + D1: Edit), CLOUDFLARE_ACCOUNT_ID,
# FOOTBALL_DATA_KEY, and optionally ONESIGNAL_APP_ID + ONESIGNAL_API_KEY (daily reminder push).
on:
  push:
    branches: [main]
    paths: ['worker/**', 'shared/**', 'package-lock.json', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Database tables
        run: npx wrangler d1 execute called-it --remote -y -c worker/wrangler.toml --file worker/schema.sql
      - name: Deploy
        run: npx wrangler deploy -c worker/wrangler.toml
      - name: Secrets
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          for name in FOOTBALL_DATA_KEY ONESIGNAL_APP_ID ONESIGNAL_API_KEY; do
            if [ -n "${!name}" ]; then printf '%s' "${!name}" | npx wrangler secret put "$name" -c worker/wrangler.toml; fi
          done
