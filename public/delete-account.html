<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Called It! — Delete your account</title>
  <style>body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:0 auto;padding:24px 16px;background:#0b1410;color:#e9f3ed}
  input,button{font:inherit;padding:12px;border-radius:12px;border:1px solid #24382d;width:100%;margin:6px 0;background:#14221b;color:#e9f3ed}
  button{background:#ff6b6b;color:#2b0000;font-weight:700;border:0}a{color:#2fd27a}</style>
</head>
<body>
<h1>Delete your Called It! account</h1>
<p>Easiest: open the app (or the <a href="./">web version</a>) and go to <b>Me → Delete account</b>.</p>
<p>No longer have the app? Enter your nickname and recovery code. Your nickname, predictions, points and group memberships are deleted immediately and for good.</p>
<form id="f">
  <input name="nick" placeholder="Nickname" required>
  <input name="recovery" placeholder="Recovery code" required>
  <button>Delete my account</button>
</form>
<p id="out"></p>
<script>
const API = '/*API_BASE*/';
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target), out = document.getElementById('out');
  try {
    let r = await fetch(API + '/v1/recover', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ nick: f.get('nick'), recovery: f.get('recovery') }) });
    const a = await r.json();
    if (!r.ok) throw new Error(a.error || 'Failed');
    r = await fetch(API + '/v1/me', { method: 'DELETE', headers: { authorization: 'Bearer ' + a.id + '.' + a.key } });
    if (!r.ok) throw new Error('Failed');
    out.textContent = 'Your account was deleted.';
  } catch (err) { out.textContent = err.message; }
});
</script>
</body>
</html>
